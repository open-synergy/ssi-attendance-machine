  - name: "Attendance Machine Import - Edit raw data via wizard"
    steps:
      - step: "Create attendance machine"
        action: "create"
        model: "attendance_machine"
        save_as: "machine"
        values:
          name: "Data Edit Wizard Test Machine"
          code: "BL0129A2"

      - step: "Create attendance machine import"
        action: "create"
        model: "attendance_machine_import"
        save_as: "machine_import"
        values:
          date: "2026-07-12"
          machine_id: "EVAL: registry['machine'].id"

      - step: "Create error data line with wrong raw data"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "data_line"
        values:
          import_id: "EVAL: registry['machine_import'].id"
          sequence: 1
          state: "error"
          error_message: "Sample error for edit wizard test"
          data: '{"emp": "OLD"}'

      - step: "Create edit wizard with corrected data"
        action: "create"
        model: "attendance_machine_import_data_edit"
        save_as: "edit_wizard"
        values:
          data_id: "EVAL: registry['data_line'].id"
          data: '{"emp": "NEW"}'

      - step: "Confirm edit wizard"
        action: "call"
        target: "edit_wizard"
        method: "action_confirm"

      - step: "Assert data line back to draft with corrected data"
        action: "assert"
        target: "data_line"
        asserts:
          state:
            type: "value"
            expected: "draft"
          error_message:
            type: "value"
            operator: "is_falsy"
          data:
            type: "value"
            operator: "contains"
            expected: "NEW"
