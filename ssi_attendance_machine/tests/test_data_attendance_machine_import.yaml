  - name:
      "Attendance Machine Import - action_retry_all_error reschedules every error line
      through the queue at once"
    steps:
      - step: "Create attendance machine"
        action: "create"
        model: "attendance_machine"
        save_as: "machine"
        values:
          name: "Retry All Error Test Machine"
          code: "BL27A1"

      - step: "Create attendance machine import"
        action: "create"
        model: "attendance_machine_import"
        save_as: "machine_import"
        values:
          date: "2026-08-05"
          machine_id: "REC: machine.id"

      - step: "Create first error data line directly, without action_load_data"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "data_line_one"
        values:
          import_id: "REC: machine_import.id"
          sequence: 1
          state: "error"
          error_message: "Employee code was not yet registered"

      - step: "Create second error data line directly, without action_load_data"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "data_line_two"
        values:
          import_id: "REC: machine_import.id"
          sequence: 2
          state: "error"
          error_message: "Employee code was not yet registered"

      - step: "Assert import starts with both lines counted as error"
        action: "assert"
        target: "machine_import"
        asserts:
          num_of_error:
            type: "value"
            expected: 2
          num_of_done:
            type: "value"
            expected: 0

      - step: "Retry every error line at once"
        action: "call"
        target: "machine_import"
        method: "action_retry_all_error"

      - step:
          "Assert every error line was reset to draft and rescheduled through the queue,
          not processed inline"
        action: "assert"
        target: "machine_import"
        refresh: true
        asserts:
          num_of_error:
            type: "value"
            expected: 0
          num_of_done:
            type: "value"
            expected: 0

      - step: "Assert first line rescheduled with a pending queue job"
        action: "assert"
        target: "data_line_one"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "draft"
          queue_job_id.state:
            type: "value"
            expected: "pending"

      - step: "Assert second line rescheduled with a pending queue job"
        action: "assert"
        target: "data_line_two"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "draft"
          queue_job_id.state:
            type: "value"
            expected: "pending"
