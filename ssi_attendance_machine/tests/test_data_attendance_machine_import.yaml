scenarios:
  - name: "Attendance Machine Import - Create and confirm workflow"
    steps:
      - step: "Create machine model"
        action: "create"
        model: "attendance_machine_model"
        save_as: "machine_model"
        values:
          name: "Import Test Model"
          code: "ITM001"

      - step: "Create CSV mapping"
        action: "create"
        model: "attendance_machine_csv_mapping"
        save_as: "csv_mapping"
        values:
          name: "Import Test CSV Mapping"
          code: "ITCM001"
          file_encoding: "utf-8"
          delimiter: "comma"
          row_mode: "single"
          datetime_mode: "combined"
          employee_column: "employee_id"
          check_in_column: "check_in"
          check_out_column: "check_out"
          datetime_format: "%Y-%m-%d %H:%M:%S"

      - step: "Create attendance machine"
        action: "create"
        model: "attendance_machine"
        save_as: "machine"
        values:
          name: "Import Test Machine"
          code: "ITM001A"
          attendance_model_id: "EVAL: registry['machine_model'].id"
          csv_mapping_id: "EVAL: registry['csv_mapping'].id"

      - step: "Create attendance machine import"
        action: "create"
        model: "attendance_machine_import"
        save_as: "machine_import"
        values:
          date: "2024-01-15"
          machine_id: "EVAL: registry['machine'].id"

      - step: "Assert import created in draft"
        action: "assert"
        target: "machine_import"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm attendance machine import"
        action: "call"
        target: "machine_import"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Assert import is in confirm state"
        action: "assert"
        target: "machine_import"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

  - name: "Attendance Machine Import - Line error on unregistered employee"
    steps:
      - step: "Create machine model"
        action: "create"
        model: "attendance_machine_model"
        save_as: "machine_model"
        values:
          name: "Error Line Test Model"
          code: "BL0127M1"

      - step: "Create CSV mapping"
        action: "create"
        model: "attendance_machine_csv_mapping"
        save_as: "csv_mapping"
        values:
          name: "Error Line Test CSV Mapping"
          code: "BL0127C1"
          file_encoding: "utf-8"
          delimiter: "comma"
          row_mode: "single"
          datetime_mode: "combined"
          employee_column: "employee_id"
          check_in_column: "check_in"
          check_out_column: "check_out"
          datetime_format: "%Y-%m-%d %H:%M:%S"

      - step: "Create attendance machine without registered employees"
        action: "create"
        model: "attendance_machine"
        save_as: "machine"
        values:
          name: "Error Line Test Machine"
          code: "BL0127A1"
          attendance_model_id: "EVAL: registry['machine_model'].id"
          csv_mapping_id: "EVAL: registry['csv_mapping'].id"

      - step: "Create attendance machine import"
        action: "create"
        model: "attendance_machine_import"
        save_as: "machine_import"
        values:
          date: "2024-01-15"
          machine_id: "EVAL: registry['machine'].id"

      - step: "Create data line with unregistered employee code"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "data_line"
        values:
          import_id: "EVAL: registry['machine_import'].id"
          sequence: 1
          data:
            '{"employee_id": "UNKNOWN001", "check_in": "2024-01-15 08:00:00",
            "check_out": "2024-01-15 17:00:00"}'

      - step: "Process attendance data line directly, unregistered employee"
        action: "call"
        target: "data_line"
        method: "_process_attendance"
        expect_error:
          type: "UserError"
          message_contains: "not registered"

  - name: "Attendance Machine Import - Unparseable row data raises UserError"
    steps:
      - step: "Create attendance machine"
        action: "create"
        model: "attendance_machine"
        save_as: "machine"
        values:
          name: "Unparseable Row Test Machine"
          code: "BL51A01"

      - step: "Create attendance machine import"
        action: "create"
        model: "attendance_machine_import"
        save_as: "machine_import"
        values:
          date: "2026-08-10"
          machine_id: "REC: machine.id"

      - step: "Create data line whose raw data is not valid JSON"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "data_line"
        values:
          import_id: "REC: machine_import.id"
          sequence: 1
          data: "not valid json"

      - step: "Process attendance data line directly, expect parse failure"
        action: "call"
        target: "data_line"
        method: "_process_attendance"
        expect_error:
          type: "UserError"
          message_contains: "not valid JSON"

  - name:
      "Attendance Machine Import - Error recorded via _record_error_in_new_cursor
      persists state and message"
    steps:
      - step: "Create attendance machine"
        action: "create"
        model: "attendance_machine"
        save_as: "machine"
        values:
          name: "Record Error Test Machine"
          code: "BL51A02"

      - step: "Create attendance machine import"
        action: "create"
        model: "attendance_machine_import"
        save_as: "machine_import"
        values:
          date: "2026-08-10"
          machine_id: "REC: machine.id"

      - step: "Create a draft data line"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "data_line"
        values:
          import_id: "REC: machine_import.id"
          sequence: 1

      - step:
          "Record an error directly through the helper _process_attendance calls from
          its except block"
        action: "call"
        target: "data_line"
        method: "_record_error_in_new_cursor"
        args:
          - "Sample error recorded outside the job transaction"

      - step: "Assert the line kept state=error with the message filled in"
        action: "assert"
        target: "data_line"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "error"
          error_message:
            type: "value"
            expected: "Sample error recorded outside the job transaction"

  - name: "Attendance Machine Import - Ignore line with reason"
    steps:
      - step: "Create attendance machine"
        action: "create"
        model: "attendance_machine"
        save_as: "machine"
        values:
          name: "Ignore Line Test Machine"
          code: "BL0127A2"

      - step: "Create attendance machine import"
        action: "create"
        model: "attendance_machine_import"
        save_as: "machine_import"
        values:
          date: "2024-01-16"
          machine_id: "REC: machine.id"

      - step: "Create an error data line, unregistered employee code"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "data_line"
        values:
          import_id: "REC: machine_import.id"
          sequence: 1
          state: "error"
          error_message: "Employee code 'UNKNOWN002' is not registered"

      - step: "Fill in ignore reason"
        action: "write"
        target: "data_line"
        values:
          ignore_reason: "Employee is no longer active, safe to ignore this row"

      - step: "Ignore the error line"
        action: "call"
        target: "data_line"
        method: "action_ignore"
        asserts:
          state:
            type: "value"
            expected: "ignored"

  - name:
      "Attendance Machine Import - Retry reschedules an error line through the queue
      instead of processing it inline"
    steps:
      - step: "Create attendance machine"
        action: "create"
        model: "attendance_machine"
        save_as: "machine"
        values:
          name: "Retry Line Test Machine"
          code: "BL0127A3"

      - step: "Create attendance machine import"
        action: "create"
        model: "attendance_machine_import"
        save_as: "machine_import"
        values:
          date: "2024-01-20"
          machine_id: "REC: machine.id"

      - step: "Create an error data line without a linked queue job"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "data_line"
        values:
          import_id: "REC: machine_import.id"
          sequence: 1
          state: "error"
          error_message: "Employee code 'EMP003' is not registered"

      - step: "Retry the error line"
        action: "call"
        target: "data_line"
        method: "action_retry"

      - step:
          "Assert the line is reset to draft and rescheduled through a new pending queue
          job, not processed inline"
        action: "assert"
        target: "data_line"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "draft"
          error_message:
            type: "value"
            operator: "is_falsy"
          attendance_id:
            type: "value"
            operator: "is_falsy"
          queue_job_id:
            type: "value"
            operator: "is_truthy"
          queue_job_id.state:
            type: "value"
            expected: "pending"

  - name: "Attendance Machine Import - Auto done when all lines resolved"
    steps:
      - step: "Create attendance machine"
        action: "create"
        model: "attendance_machine"
        save_as: "machine"
        values:
          name: "Auto Done Test Machine"
          code: "BL0127A4"

      - step: "Create attendance machine import"
        action: "create"
        model: "attendance_machine_import"
        save_as: "machine_import"
        values:
          date: "2024-01-25"
          machine_id: "EVAL: registry['machine'].id"

      - step: "Force import into Queue To Done state"
        action: "write"
        target: "machine_import"
        values:
          state: "queue_done"

      - step: "Create a resolved (done) data line"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "data_line_done"
        values:
          import_id: "EVAL: registry['machine_import'].id"
          sequence: 1
          state: "done"

      - step: "Create an ignored data line"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "data_line_ignored"
        values:
          import_id: "EVAL: registry['machine_import'].id"
          sequence: 2
          state: "ignored"
          ignore_reason: "Duplicated row, safe to ignore"

      - step: "Try to auto-complete the import document"
        action: "call"
        target: "machine_import"
        method: "_try_action_done"

      - step: "Assert import document is done"
        action: "assert"
        target: "machine_import"
        asserts:
          state:
            type: "value"
            expected: "done"

  - name:
      "Attendance Machine Import - Ignoring the last error line completes the import"
    steps:
      - step: "Create attendance machine"
        action: "create"
        model: "attendance_machine"
        save_as: "machine"
        values:
          name: "BL-0185 Ignore Last Error Test Machine"
          code: "BL0185A1"

      - step: "Create attendance machine import"
        action: "create"
        model: "attendance_machine_import"
        save_as: "machine_import"
        values:
          date: "2026-07-14"
          machine_id: "EVAL: registry['machine'].id"

      - step: "Force import into Queue To Done state"
        action: "write"
        target: "machine_import"
        values:
          state: "queue_done"

      - step: "Create a resolved (done) data line"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "data_line_done"
        values:
          import_id: "EVAL: registry['machine_import'].id"
          sequence: 1
          state: "done"

      - step: "Create the last remaining error data line, without a queue job link"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "data_line_error"
        values:
          import_id: "EVAL: registry['machine_import'].id"
          sequence: 2
          state: "error"
          error_message: "Sample error, will be ignored"

      - step: "Fill in ignore reason"
        action: "write"
        target: "data_line_error"
        values:
          ignore_reason: "Duplicated row, safe to ignore"

      - step: "Ignore the last error line"
        action: "call"
        target: "data_line_error"
        method: "action_ignore"
        asserts:
          state:
            type: "value"
            expected: "ignored"

      - step: "Assert import document auto-completed to done"
        action: "assert"
        target: "machine_import"
        asserts:
          state:
            type: "value"
            expected: "done"
          num_of_error:
            type: "value"
            expected: 0
          num_of_ignored:
            type: "value"
            expected: 1

  - name: "Attendance Machine Import - Draft line blocks import from completing"
    steps:
      - step: "Create attendance machine"
        action: "create"
        model: "attendance_machine"
        save_as: "machine"
        values:
          name: "BL-0185 Draft Blocks Done Test Machine"
          code: "BL0185A2"

      - step: "Create attendance machine import"
        action: "create"
        model: "attendance_machine_import"
        save_as: "machine_import"
        values:
          date: "2026-07-14"
          machine_id: "EVAL: registry['machine'].id"

      - step: "Force import into Queue To Done state"
        action: "write"
        target: "machine_import"
        values:
          state: "queue_done"

      - step: "Create a resolved (done) data line"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "data_line_done"
        values:
          import_id: "EVAL: registry['machine_import'].id"
          sequence: 1
          state: "done"

      - step: "Create a data line still in draft"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "data_line_draft"
        values:
          import_id: "EVAL: registry['machine_import'].id"
          sequence: 2

      - step: "Try to auto-complete the import document"
        action: "call"
        target: "machine_import"
        method: "_try_action_done"

      - step: "Assert import document stays in queue_done"
        action: "assert"
        target: "machine_import"
        asserts:
          state:
            type: "value"
            expected: "queue_done"

  - name: "Attendance Machine Import - Error line blocks import from completing"
    steps:
      - step: "Create attendance machine"
        action: "create"
        model: "attendance_machine"
        save_as: "machine"
        values:
          name: "BL-0185 Error Blocks Done Test Machine"
          code: "BL0185A3"

      - step: "Create attendance machine import"
        action: "create"
        model: "attendance_machine_import"
        save_as: "machine_import"
        values:
          date: "2026-07-14"
          machine_id: "EVAL: registry['machine'].id"

      - step: "Force import into Queue To Done state"
        action: "write"
        target: "machine_import"
        values:
          state: "queue_done"

      - step: "Create a resolved (done) data line"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "data_line_done"
        values:
          import_id: "EVAL: registry['machine_import'].id"
          sequence: 1
          state: "done"

      - step: "Create a data line still in error"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "data_line_error"
        values:
          import_id: "EVAL: registry['machine_import'].id"
          sequence: 2
          state: "error"
          error_message: "Sample unresolved error"

      - step: "Try to auto-complete the import document"
        action: "call"
        target: "machine_import"
        method: "_try_action_done"

      - step: "Assert import document stays in queue_done"
        action: "assert"
        target: "machine_import"
        asserts:
          state:
            type: "value"
            expected: "queue_done"

  - name: "Attendance Machine Import - Data line counters"
    steps:
      - step: "Create attendance machine"
        action: "create"
        model: "attendance_machine"
        save_as: "machine"
        values:
          name: "Counter Test Machine"
          code: "BL0127A5"

      - step: "Create attendance machine import"
        action: "create"
        model: "attendance_machine_import"
        save_as: "machine_import"
        values:
          date: "2024-01-26"
          machine_id: "EVAL: registry['machine'].id"

      - step: "Create draft data line"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "data_line_draft"
        values:
          import_id: "EVAL: registry['machine_import'].id"
          sequence: 1

      - step: "Create done data line"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "data_line_done"
        values:
          import_id: "EVAL: registry['machine_import'].id"
          sequence: 2
          state: "done"

      - step: "Create error data line"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "data_line_error"
        values:
          import_id: "EVAL: registry['machine_import'].id"
          sequence: 3
          state: "error"
          error_message: "Sample error"

      - step: "Create ignored data line"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "data_line_ignored"
        values:
          import_id: "EVAL: registry['machine_import'].id"
          sequence: 4
          state: "ignored"
          ignore_reason: "Sample ignore reason"

      - step: "Assert counters"
        action: "assert"
        target: "machine_import"
        asserts:
          num_of_data:
            type: "value"
            expected: 4
          num_of_done:
            type: "value"
            expected: 1
          num_of_error:
            type: "value"
            expected: 1
          num_of_ignored:
            type: "value"
            expected: 1

  - name: "Attendance Machine Import - Ignore individual line via wizard"
    steps:
      - step: "Create attendance machine"
        action: "create"
        model: "attendance_machine"
        save_as: "machine"
        values:
          name: "Data Ignore Wizard Test Machine"
          code: "BL0129A1"

      - step: "Create attendance machine import"
        action: "create"
        model: "attendance_machine_import"
        save_as: "machine_import"
        values:
          date: "2026-07-12"
          machine_id: "EVAL: registry['machine'].id"

      - step: "Create error data line"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "data_line"
        values:
          import_id: "EVAL: registry['machine_import'].id"
          sequence: 1
          state: "error"
          error_message: "Sample error for ignore wizard test"

      - step: "Create a second error data line that must stay untouched"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "other_data_line"
        values:
          import_id: "EVAL: registry['machine_import'].id"
          sequence: 2
          state: "error"
          error_message: "Another sample error"

      - step: "Create ignore wizard for the first data line"
        action: "create"
        model: "attendance_machine_import_data_ignore"
        save_as: "ignore_wizard"
        values:
          data_id: "EVAL: registry['data_line'].id"
          reason: "Employee resigned"

      - step: "Confirm ignore wizard"
        action: "call"
        target: "ignore_wizard"
        method: "action_confirm"

      - step: "Assert data line is ignored with reason"
        action: "assert"
        target: "data_line"
        asserts:
          state:
            type: "value"
            expected: "ignored"
          ignore_reason:
            type: "value"
            expected: "Employee resigned"

      - step: "Assert other data line is still error"
        action: "assert"
        target: "other_data_line"
        asserts:
          state:
            type: "value"
            expected: "error"

  - name: "Attendance Machine Import - Single mode row creates full attendance via hook"
    steps:
      - step: "Create machine model"
        action: "create"
        model: "attendance_machine_model"
        save_as: "machine_model"
        values:
          name: "Hook Single Test Model"
          code: "BL0175M1"

      - step: "Create CSV mapping (single row mode)"
        action: "create"
        model: "attendance_machine_csv_mapping"
        save_as: "csv_mapping"
        values:
          name: "Hook Single Test CSV Mapping"
          code: "BL0175C1"
          file_encoding: "utf-8"
          delimiter: "comma"
          row_mode: "single"
          datetime_mode: "combined"
          employee_column: "employee_id"
          check_in_column: "check_in"
          check_out_column: "check_out"
          datetime_format: "%Y-%m-%d %H:%M:%S"

      - step: "Create attendance machine"
        action: "create"
        model: "attendance_machine"
        save_as: "machine"
        values:
          name: "Hook Single Test Machine"
          code: "BL0175A1"
          attendance_model_id: "EVAL: registry['machine_model'].id"
          csv_mapping_id: "EVAL: registry['csv_mapping'].id"

      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Hook Single Test Employee"

      - step: "Register employee code on the machine"
        action: "create"
        model: "attendance_machine.employee"
        save_as: "machine_employee"
        values:
          machine_id: "EVAL: registry['machine'].id"
          employee_id: "EVAL: registry['employee'].id"
          employee_code: "BL0175EMP1"

      - step: "Get working schedule"
        action: "search"
        model: "resource.calendar"
        domain: []
        save_as: "working_schedule"
        limit: 1
        order: "id asc"

      - step: "Create timesheet (draft)"
        action: "create"
        model: "hr.timesheet"
        save_as: "timesheet"
        as_user: "base.user_admin"
        values:
          employee_id: "EVAL: registry['employee'].id"
          date_start: 2026-02-01
          date_end: 2026-02-28
          working_schedule_id: "EVAL: registry['working_schedule'].id"

      - step: "Open timesheet"
        action: "call"
        target: "timesheet"
        method: "action_open"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create attendance machine import"
        action: "create"
        model: "attendance_machine_import"
        save_as: "machine_import"
        values:
          date: "2026-02-10"
          machine_id: "EVAL: registry['machine'].id"

      - step: "Create data line with check-in and check-out"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "data_line"
        values:
          import_id: "EVAL: registry['machine_import'].id"
          sequence: 1
          data:
            '{"employee_id": "BL0175EMP1", "check_in": "2026-02-10 08:00:00",
            "check_out": "2026-02-10 17:00:00"}'

      - step: "Process attendance data line directly"
        action: "call"
        target: "data_line"
        method: "_process_attendance"

      - step: "Assert data line resolved to done with attendance linked"
        action: "assert"
        target: "data_line"
        asserts:
          state:
            type: "value"
            expected: "done"
          attendance_id:
            type: "value"
            operator: "is_truthy"

      - step:
          "Verify the created attendance is linked to the right employee, sheet and date"
        action: "search"
        model: "hr.timesheet_attendance"
        domain:
          - ["employee_id", "=", "EVAL: registry['employee'].id"]
          - ["sheet_id", "=", "EVAL: registry['timesheet'].id"]
          - ["date", "=", 2026-02-10]
        save_as: "attendance"
        expect_count: 1

      - step: "Verify the created attendance carries check_in and check_out"
        action: "assert"
        target: "attendance"
        asserts:
          check_in:
            type: "value"
            operator: "is_truthy"
          check_out:
            type: "value"
            operator: "is_truthy"

      - step: "Assert attendance_count on the import matches the single successful row"
        action: "assert"
        target: "machine_import"
        asserts:
          attendance_count:
            type: "value"
            expected: 1

  - name:
      "Attendance Machine Import - Separate mode sign-in creates attendance without
      check_out"
