scenarios:
  - name: "Attendance Machine Import - Documenso Signing: has signing fields"
    steps:
      - step: "Create machine model"
        action: "create"
        model: "attendance_machine_model"
        save_as: "machine_model"
        values:
          name: "Import DS Test Model"
          code: "IDSTM001"

      - step: "Create CSV mapping"
        action: "create"
        model: "attendance_machine_csv_mapping"
        save_as: "csv_mapping"
        values:
          name: "Import DS Test CSV Mapping"
          code: "IDSCM001"
          file_encoding: "utf-8"
          delimiter: "comma"
          row_mode: "single"
          datetime_mode: "combined"
          employee_column: "employee_id"
          check_in_column: "check_in"
          check_out_column: "check_out"
          datetime_format: "%Y-%m-%d %H:%M:%S"

      - step: "Create attendance machine"
        action: "create"
        model: "attendance_machine"
        save_as: "machine"
        values:
          name: "Import DS Test Machine"
          code: "IDSMACH01"
          attendance_model_id: "EVAL: registry['machine_model'].id"
          csv_mapping_id: "EVAL: registry['csv_mapping'].id"

      - step: "Create attendance machine import"
        action: "create"
        model: "attendance_machine_import"
        save_as: "machine_import"
        values:
          date: "2026-01-15"
          machine_id: "EVAL: registry['machine'].id"

      - step: "Assert import has documenso signing fields"
        action: "assert"
        target: "machine_import"
        asserts:
          state:
            type: "value"
            expected: "draft"
          signature_request_ids:
            type: "value"
            operator: "is_falsy"
          approval_signature_request_id:
            type: "value"
            operator: "is_falsy"
