    steps:
      - step: "Get main (default) operating unit"
        action: "ref"
        xml_id: "operating_unit.main_operating_unit"
        save_as: "main_ou"

      - step: "Create partner for operating unit A"
        action: "create"
        model: "res.partner"
        save_as: "partner_ou_a"
        values:
          name: "BL0176 Operating Unit A Partner (Guard)"

      - step: "Create operating unit A (not the default one)"
        action: "create"
        model: "operating.unit"
        save_as: "ou_a"
        values:
          name: "BL0176 Operating Unit A Guard"
          code: "BL0176OUA3"
          partner_id: "EVAL: registry['partner_ou_a'].id"

      - step: "Create employee with operating unit A"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "BL0176 Guard Test Employee"
          operating_unit_id: "EVAL: registry['ou_a'].id"

      - step: "Create machine model"
