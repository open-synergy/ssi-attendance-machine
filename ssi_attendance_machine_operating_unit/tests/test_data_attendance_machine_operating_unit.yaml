      - step: "Verify the created attendance is NOT on the default operating unit"
        action: "search"
        model: "hr.timesheet_attendance"
        domain:
          - ["employee_id", "=", "EVAL: registry['employee'].id"]
          - ["sheet_id", "=", "EVAL: registry['timesheet'].id"]
          - ["date", "=", 2026-03-12]
          - ["operating_unit_id", "!=", "EVAL: registry['main_ou'].id"]
          - ["operating_unit_id", "=", "EVAL: registry['ou_a'].id"]
        save_as: "attendance"
        expect_count: 1

  - name:
      "Attendance Machine Import - Employee without operating unit still imports
      successfully"
    steps:
      - step: "Create employee without operating unit"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "BL0176 No OU Test Employee"

      - step: "Assert employee has no explicit operating unit override"
        action: "assert"
        target: "employee"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"

      - step: "Create machine model"
        action: "create"
        model: "attendance_machine_model"
        save_as: "machine_model"
        values:
