        model: "attendance_machine_csv_mapping"
        save_as: "csv_mapping"
        values:
          name: "BL0176 Separate Test CSV Mapping"
          code: "BL0176C2"
          file_encoding: "utf-8"
          delimiter: "comma"
          row_mode: "separate"
          datetime_mode: "combined"
          employee_column: "employee_id"
          row_type_column: "row_type"
          sign_in_value: "IN"
          sign_out_value: "OUT"
          datetime_column: "datetime"
          datetime_format: "%Y-%m-%d %H:%M:%S"

      - step: "Create attendance machine"
        action: "create"
        model: "attendance_machine"
        save_as: "machine"
        values:
          name: "BL0176 Separate Test Machine"
          code: "BL0176A2"
          attendance_model_id: "EVAL: registry['machine_model'].id"
          csv_mapping_id: "EVAL: registry['csv_mapping'].id"

      - step: "Register employee code on the machine"
        action: "create"
        model: "attendance_machine.employee"
        save_as: "machine_employee"
        values:
          machine_id: "EVAL: registry['machine'].id"
          employee_id: "EVAL: registry['employee'].id"
          employee_code: "BL0176EMP2"

      - step: "Get working schedule"
        action: "search"
        model: "resource.calendar"
        domain: []
        save_as: "working_schedule"
        limit: 1
        order: "id asc"

      - step: "Create timesheet (draft)"
        action: "create"
        model: "hr.timesheet"
        save_as: "timesheet"
        as_user: "base.user_admin"
        values:
          employee_id: "EVAL: registry['employee'].id"
          date_start: 2026-03-01
          date_end: 2026-03-31
          working_schedule_id: "EVAL: registry['working_schedule'].id"

      - step: "Open timesheet"
        action: "call"
        target: "timesheet"
        method: "action_open"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create attendance machine import"
        action: "create"
        model: "attendance_machine_import"
        save_as: "machine_import"
        values:
          date: "2026-03-11"
          machine_id: "EVAL: registry['machine'].id"

      - step: "Create sign-in only data line"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "data_line"
        values:
          import_id: "EVAL: registry['machine_import'].id"
          sequence: 1
          data:
            '{"employee_id": "BL0176EMP2", "row_type": "IN", "datetime": "2026-03-11
            08:00:00"}'

      - step: "Process attendance data line directly"
        action: "call"
        target: "data_line"
        method: "_process_attendance"

      - step: "Assert data line resolved to done with attendance linked"
        action: "assert"
        target: "data_line"
        asserts:
          state:
            type: "value"
            expected: "done"
          attendance_id:
            type: "value"
            operator: "is_truthy"

      - step: "Verify the created attendance carries operating unit A without check_out"
        action: "search"
        model: "hr.timesheet_attendance"
        domain:
          - ["employee_id", "=", "EVAL: registry['employee'].id"]
          - ["sheet_id", "=", "EVAL: registry['timesheet'].id"]
          - ["date", "=", 2026-03-11]
          - ["check_in", "=", "2026-03-11 08:00:00"]
          - ["check_out", "=", false]
          - ["operating_unit_id", "=", "EVAL: registry['ou_a'].id"]
        save_as: "attendance"
        expect_count: 1

  - name:
      "Attendance Machine Import - Attendance operating unit differs from the default
