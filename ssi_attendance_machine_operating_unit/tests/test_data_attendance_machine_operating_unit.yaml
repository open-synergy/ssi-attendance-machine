            operator: "is_truthy"

      - step: "Find the created attendance"
        action: "search"
        model: "hr.timesheet_attendance"
        domain:
          - ["employee_id", "=", "REC: employee.id"]
          - ["sheet_id", "=", "REC: timesheet.id"]
          - ["date", "=", 2026-04-13]
        save_as: "attendance"
        expect_count: 1

      - step:
          "Verify the attendance has no operating unit -- neither the employee's nor the
