scenarios:
  - name: "Attendance Machine Import - Operating Unit: record has operating_unit_id"
    steps:
      - step: "Get default operating unit"
        action: "ref"
        xml_id: "operating_unit.main_operating_unit"
        save_as: "ou"

      - step: "Create attendance machine"
        action: "create"
        model: "attendance_machine"
        save_as: "machine"
        values:
          name: "Test Machine OU Import"
          code: "TM-OU-IMP-001"

      - step: "Create attendance machine import with operating_unit_id"
        action: "create"
        model: "attendance_machine_import"
        save_as: "machine_import"
        values:
          date: "2024-01-15"
          machine_id: "EVAL: registry['machine'].id"
          operating_unit_id: "EVAL: registry['ou'].id"

      - step: "Assert operating_unit_id is set"
        action: "assert"
        target: "machine_import"
        asserts:
          operating_unit_id:
            type: "value"
            operator: "is_truthy"
          machine_id:
            type: "value"
            operator: "is_truthy"

  - name:
      "Attendance Machine Import - Single mode attendance follows employee's operating
      unit"
    steps:
      - step: "Create partner for operating unit A"
        action: "create"
        model: "res.partner"
        save_as: "partner_ou_a"
        values:
          name: "BL0176 Operating Unit A Partner"

      - step: "Create operating unit A (not the default one)"
        action: "create"
        model: "operating.unit"
        save_as: "ou_a"
        values:
          name: "BL0176 Operating Unit A"
          code: "BL0176OUA1"
          partner_id: "EVAL: registry['partner_ou_a'].id"

      - step: "Create employee with operating unit A"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "BL0176 Single Test Employee"
          operating_unit_id: "EVAL: registry['ou_a'].id"

      - step: "Create machine model"
        action: "create"
        model: "attendance_machine_model"
        save_as: "machine_model"
        values:
          name: "BL0176 Single Test Model"
          code: "BL0176M1"

      - step: "Create CSV mapping (single row mode)"
        action: "create"
        model: "attendance_machine_csv_mapping"
        save_as: "csv_mapping"
        values:
          name: "BL0176 Single Test CSV Mapping"
          code: "BL0176C1"
          file_encoding: "utf-8"
          delimiter: "comma"
          row_mode: "single"
          datetime_mode: "combined"
          employee_column: "employee_id"
          check_in_column: "check_in"
          check_out_column: "check_out"
          datetime_format: "%Y-%m-%d %H:%M:%S"

      - step: "Create attendance machine"
        action: "create"
        model: "attendance_machine"
        save_as: "machine"
        values:
          name: "BL0176 Single Test Machine"
          code: "BL0176A1"
          attendance_model_id: "EVAL: registry['machine_model'].id"
          csv_mapping_id: "EVAL: registry['csv_mapping'].id"

      - step: "Register employee code on the machine"
        action: "create"
        model: "attendance_machine.employee"
        save_as: "machine_employee"
        values:
          machine_id: "EVAL: registry['machine'].id"
          employee_id: "EVAL: registry['employee'].id"
          employee_code: "BL0176EMP1"

      - step: "Get working schedule"
        action: "search"
        model: "resource.calendar"
        domain: []
        save_as: "working_schedule"
        limit: 1
        order: "id asc"

      - step: "Create timesheet (draft)"
        action: "create"
        model: "hr.timesheet"
        save_as: "timesheet"
        as_user: "base.user_admin"
        values:
          employee_id: "EVAL: registry['employee'].id"
          date_start: 2026-03-01
          date_end: 2026-03-31
          working_schedule_id: "EVAL: registry['working_schedule'].id"

      - step: "Open timesheet"
        action: "call"
        target: "timesheet"
        method: "action_open"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create attendance machine import"
        action: "create"
        model: "attendance_machine_import"
        save_as: "machine_import"
        values:
          date: "2026-03-10"
          machine_id: "EVAL: registry['machine'].id"

      - step: "Create data line with check-in and check-out"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "data_line"
        values:
          import_id: "EVAL: registry['machine_import'].id"
          sequence: 1
          data:
            '{"employee_id": "BL0176EMP1", "check_in": "2026-03-10 08:00:00",
            "check_out": "2026-03-10 17:00:00"}'

      - step: "Process attendance data line directly"
        action: "call"
        target: "data_line"
        method: "_process_attendance"

      - step: "Assert data line resolved to done with attendance linked"
        action: "assert"
        target: "data_line"
        asserts:
          state:
            type: "value"
            expected: "done"
          attendance_id:
            type: "value"
            operator: "is_truthy"

      - step: "Verify the created attendance carries operating unit A"
        action: "search"
        model: "hr.timesheet_attendance"
        domain:
          - ["employee_id", "=", "EVAL: registry['employee'].id"]
          - ["sheet_id", "=", "EVAL: registry['timesheet'].id"]
          - ["date", "=", 2026-03-10]
          - ["check_in", "=", "2026-03-10 08:00:00"]
          - ["check_out", "=", "2026-03-10 17:00:00"]
          - ["operating_unit_id", "=", "EVAL: registry['ou_a'].id"]
        save_as: "attendance"
        expect_count: 1

