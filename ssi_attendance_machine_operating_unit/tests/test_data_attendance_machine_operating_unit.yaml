      - step: "Create attendance machine import"
        action: "create"
        model: "attendance_machine_import"
        save_as: "machine_import"
        values:
          date: "2026-04-13"
          machine_id: "REC: machine.id"

      - step: "Create data line with check-in and check-out"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "data_line"
        values:
          import_id: "REC: machine_import.id"
          sequence: 1
