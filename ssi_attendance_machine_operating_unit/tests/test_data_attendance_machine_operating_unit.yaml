          sequence: 1
          data:
            '{"employee_id": "OU55EMP2", "row_type": "IN", "datetime": "2026-04-11
            08:00:00"}'

      - step: "Process attendance data line directly"
        action: "call"
        target: "data_line"
        method: "_process_attendance"

      - step: "Assert data line resolved to done with attendance linked"
        action: "assert"
        target: "data_line"
        asserts:
          state:
            type: "value"
            expected: "done"
          attendance_id:
            type: "value"
            operator: "is_truthy"

      - step: "Find the created attendance"
        action: "search"
        model: "hr.timesheet_attendance"
        domain:
          - ["employee_id", "=", "REC: employee.id"]
          - ["sheet_id", "=", "REC: timesheet.id"]
          - ["date", "=", 2026-04-11]
        save_as: "attendance"
        expect_count: 1

      - step:
          "Verify the attendance carries the timesheet's operating unit and has no
          check_out"
        action: "assert"
        target: "attendance"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: ou_b"
          check_in:
            type: "value"
            operator: "is_truthy"
          check_out:
            type: "value"
            operator: "is_falsy"

  - name:
      "Attendance Machine Import - Guard: attendance keeps the timesheet's operating
      unit even when processed by a user with a different default operating unit"
    steps:
      - step: "Create partner for the employee's operating unit"
        action: "create"
        model: "res.partner"
        save_as: "partner_ou_a"
        values:
          name: "OU55 Employee OU Partner (Guard)"

      - step: "Create operating unit A (the employee's, not used by the attendance)"
        action: "create"
        model: "operating.unit"
        save_as: "ou_a"
        values:
          name: "OU55 Employee OU (Guard)"
          code: "OU55OUA3"
          partner_id: "REC: partner_ou_a.id"

      - step: "Create partner for the timesheet's operating unit"
        action: "create"
        model: "res.partner"
        save_as: "partner_ou_b"
        values:
          name: "OU55 Timesheet OU Partner (Guard)"

      - step: "Create operating unit B (the timesheet's, expected on the attendance)"
        action: "create"
        model: "operating.unit"
        save_as: "ou_b"
        values:
          name: "OU55 Timesheet OU (Guard)"
          code: "OU55OUB3"
          partner_id: "REC: partner_ou_b.id"

      - step:
          "Get the main operating unit (base.user_admin's default -- must NOT leak onto
          the attendance)"
        action: "ref"
        xml_id: "operating_unit.main_operating_unit"
        save_as: "main_ou"

      - step: "Create employee with operating unit A"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "OU55 Guard Test Employee"
          operating_unit_id: "REC: ou_a.id"

      - step: "Create machine model"
        action: "create"
        model: "attendance_machine_model"
        save_as: "machine_model"
        values:
          name: "OU55 Guard Test Model"
          code: "OU55M3"

      - step: "Create CSV mapping (single row mode)"
        action: "create"
        model: "attendance_machine_csv_mapping"
        save_as: "csv_mapping"
        values:
          name: "OU55 Guard Test CSV Mapping"
          code: "OU55C3"
          file_encoding: "utf-8"
          delimiter: "comma"
          row_mode: "single"
          datetime_mode: "combined"
          employee_column: "employee_id"
          check_in_column: "check_in"
          check_out_column: "check_out"
          datetime_format: "%Y-%m-%d %H:%M:%S"

      - step: "Create attendance machine"
        action: "create"
        model: "attendance_machine"
        save_as: "machine"
        values:
          name: "OU55 Guard Test Machine"
          code: "OU55A3"
          attendance_model_id: "REC: machine_model.id"
          csv_mapping_id: "REC: csv_mapping.id"

      - step: "Register employee code on the machine"
        action: "create"
        model: "attendance_machine.employee"
        save_as: "machine_employee"
        values:
          machine_id: "REC: machine.id"
          employee_id: "REC: employee.id"
          employee_code: "OU55EMP3"

      - step: "Get working schedule"
        action: "search"
        model: "resource.calendar"
        domain: []
        save_as: "working_schedule"
        limit: 1
        order: "id asc"

      - step: "Create timesheet (draft) explicitly on operating unit B"
        action: "create"
        model: "hr.timesheet"
        save_as: "timesheet"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee.id"
          date_start: 2026-04-01
          date_end: 2026-04-30
          working_schedule_id: "REC: working_schedule.id"
          operating_unit_id: "REC: ou_b.id"

      - step: "Open timesheet"
        action: "call"
        target: "timesheet"
        method: "action_open"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create attendance machine import"
        action: "create"
        model: "attendance_machine_import"
        save_as: "machine_import"
        values:
          date: "2026-04-12"
          machine_id: "REC: machine.id"

      - step: "Create data line with check-in and check-out"
        action: "create"
        model: "attendance_machine_import.data"
        save_as: "data_line"
        values:
          import_id: "REC: machine_import.id"
          sequence: 1
          data:
            '{"employee_id": "OU55EMP3", "check_in": "2026-04-12 08:00:00", "check_out":
            "2026-04-12 17:00:00"}'

      - step:
          "Process attendance data line as base.user_admin, whose default operating unit
          is the main one -- neither OU A nor OU B"
        action: "call"
        target: "data_line"
        method: "_process_attendance"
        as_user: "base.user_admin"

      - step: "Assert data line resolved to done with attendance linked"
        action: "assert"
        target: "data_line"
        asserts:
          state:
            type: "value"
            expected: "done"
          attendance_id:
            type: "value"
            operator: "is_truthy"

      - step: "Find the created attendance"
        action: "search"
        model: "hr.timesheet_attendance"
        domain:
          - ["employee_id", "=", "REC: employee.id"]
          - ["sheet_id", "=", "REC: timesheet.id"]
          - ["date", "=", 2026-04-12]
        save_as: "attendance"
        expect_count: 1

      - step:
          "Verify the attendance carries the timesheet's operating unit, not the
          processing user's default"
        action: "assert"
        target: "attendance"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: ou_b"

      - step:
          "Explicit differentiator: no attendance on this sheet carries the processing
          user's default operating unit"
        action: "search"
        model: "hr.timesheet_attendance"
        domain:
          - ["sheet_id", "=", "REC: timesheet.id"]
          - ["operating_unit_id", "=", "REC: main_ou.id"]
        save_as: "attendance_on_admin_default_ou"
        expect_count: 0

  - name:
      "Attendance Machine Import - Timesheet without operating unit yields an attendance
      without operating unit"
    steps:
      - step: "Create partner for the employee's operating unit"
        action: "create"
        model: "res.partner"
        save_as: "partner_ou_a"
        values:
          name: "OU55 Employee OU Partner (No OU)"

      - step: "Create operating unit A (the employee's, must not leak either)"
